<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; r: 2; }
        50% { opacity: 1; r: 4; }
      }
      .terminal { animation: float 6s ease-in-out infinite; }
      .cursor { animation: blink 1s infinite; fill: #00e5ff; }
      .text1 { animation: slideIn 0.5s ease forwards; opacity: 0; }
      .text2 { animation: slideIn 0.5s ease forwards 1s; opacity: 0; }
      .text3 { animation: slideIn 0.5s ease forwards 2s; opacity: 0; }
      .text4 { animation: slideIn 0.5s ease forwards 3s; opacity: 0; }
      .node { animation: pulse 3s infinite; filter: url(#glow); }
      .node1 { animation-delay: 0s; cx: 50; cy: 50; fill: #ff007f; }
      .node2 { animation-delay: 1s; cx: 350; cy: 250; fill: #00e5ff; }
      .node3 { animation-delay: 2s; cx: 320; cy: 60; fill: #ff007f; }
      .node4 { animation-delay: 1.5s; cx: 60; cy: 220; fill: #00e5ff; }
      
      .line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    </style>
  </defs>

  <!-- Background Grid -->
  <g class="grid">
    <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" class="line"/>
    <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" class="line"/>
  </g>

  <!-- Glowing Nodes -->
  <circle class="node node1" />
  <circle class="node node2" />
  <circle class="node node3" />
  <circle class="node node4" />

  <!-- Connecting Lines -->
  <path d="M 50 50 L 100 120 L 300 120 L 350 250" fill="none" stroke="url(#neonGradient)" stroke-width="1.5" opacity="0.3" stroke-dasharray="5,5" />
  
  <!-- Terminal Window -->
  <g class="terminal">
    <!-- Window Body -->
    <rect x="70" y="70" width="260" height="160" rx="8" fill="#090914" stroke="url(#neonGradient)" stroke-width="2" filter="url(#glow)"/>
    <!-- Window Header -->
    <rect x="71" y="71" width="258" height="25" rx="8" fill="#151525" />
    <circle cx="85" cy="83" r="4" fill="#ff5f56" />
    <circle cx="100" cy="83" r="4" fill="#ffbd2e" />
    <circle cx="115" cy="83" r="4" fill="#27c93f" />
    <text x="200" y="87" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">roshan@server:~</text>

    <!-- Terminal Content -->
    <g font-family="monospace" font-size="11" fill="#e0e0e0">
      <text x="85" y="120" class="text1"><tspan fill="#ff007f">❯</tspan> npm run dev</text>
      <text x="85" y="140" class="text2" fill="#27c93f">✔ Server started on port 3000</text>
      <text x="85" y="160" class="text3"><tspan fill="#ff007f">❯</tspan> connecting database...</text>
      <text x="85" y="180" class="text4" fill="#00e5ff">✔ MongoDB connected</text>
      <text x="85" y="200" style="animation: slideIn 0.5s ease forwards 4s; opacity: 0;"><tspan fill="#ff007f">❯</tspan> <tspan class="cursor">█</tspan></text>
    </g>
  </g>
</svg>
